# Repository-specific identifiers, quotations and deliberate fixtures.
# typos.toml is generated from this overlay by typos-config-builder; never
# edit typos.toml by hand.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
ignore = [
  # Inline code spans carry wire tokens, identifiers and quoted bytes.
  '`[^`\n]+`',
  # FILP is the flattened-file stream tag carried on the wire.
  '\bFILP\b',
  # Eight-digit hexadecimal addresses of functions in the analysed binary.
  '\b1[0-9a-f]{7}\b',
  # Plural of the PNG image format.
  '\bPNGs\b',
  # Placeholder for a Sleuth Kit catalogue address in a quoted command.
  '\bCATALOG-[0-9]+-[0-9]+\b',
  # An audited heading: its anchor is recorded in the gap register, so its
  # spelling is kept until an audit revision renames the section.
  '(?m)^## Preparation and later authorised capture$',
]

[files]
# Evidence is preserved byte for byte. The style guide is an upstream copy.
# gap-analysis.md is generated from gap-register.json, whose recorded strings
# are preserved as written.
exclude = [
  "evidence/**",
  "docs/documentation-style-guide.md",
  "gap-analysis.md",
  # Hash-pinned by evidence/hotline-server-1.9; preserved byte for byte.
  "docs/baseline-validity-ledger.md",
  # Upstream patch text.
  "patches/**",
]
